<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>Schlamassel App</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ── Auth Screen ── -->
  <div id="screen-auth" class="hidden">
    <div class="auth-container">
      <h1>Schlamassel App</h1>
      <form id="auth-form" class="auth-form" autocomplete="on">
        <h2 id="auth-title">Anmelden</h2>
        <input id="auth-username" class="auth-input" type="text" name="username"
               placeholder="Name" autocomplete="username" autocapitalize="off"
               autocorrect="off" spellcheck="false" required>
        <input id="auth-password" class="auth-input" type="password" name="password"
               placeholder="Passwort" autocomplete="current-password" required>
        <p id="auth-error" class="auth-error" role="alert"></p>
        <button id="auth-submit" type="submit" class="btn-auth">Einloggen</button>
        <a id="auth-toggle" class="auth-toggle" href="#">Neu hier? Konto erstellen</a>
      </form>
    </div>
  </div>

  <!-- ── App Screen ── -->
  <div id="screen-app" class="hidden">

    <!-- Top bar: page title + hamburger -->
    <header class="topbar">
      <span id="page-title" class="topbar-title">Heutige Einheit</span>
      <button id="btn-menu" class="btn-menu" aria-label="Menü" aria-expanded="false" aria-controls="nav-menu">
        <span class="menu-icon menu-icon-open" aria-hidden="true">☰</span>
        <span class="menu-icon menu-icon-close" aria-hidden="true">✕</span>
      </button>
    </header>

    <!-- Dim overlay + slide-down navigation panel -->
    <div id="nav-scrim" class="nav-scrim"></div>
    <nav id="nav-menu" class="nav-menu" aria-hidden="true">
      <div id="nav-username" class="nav-username"></div>
      <button class="nav-item" data-page="page-today">Heutige Einheit</button>
      <button class="nav-item" data-page="page-leaderboard">Rangliste</button>
      <button class="nav-item" data-page="page-plan">Trainingsplan</button>
      <button id="btn-logout" class="nav-item nav-logout">Abmelden</button>
    </nav>

    <main id="page-content">

      <!-- Page: Heutige Einheit -->
      <section id="page-today" class="page">
        <div class="welcome-card">
          <h2 class="welcome-title">Willkommen in der Schlamassel App</h2>
          <p class="welcome-subtitle">Dein Weg zum ersten Muscle-Up.</p>
        </div>
        <div id="phase-banner" class="phase-banner">
          <div class="phase-info">
            <span id="phase-label" class="phase-label"></span>
            <span id="phase-badge" class="phase-badge"></span>
          </div>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <div class="section">
          <div id="exercise-list"></div>
          <button id="btn-complete" class="btn-complete" disabled>Session abschließen</button>
          <div id="post-session-bar" class="post-session-bar hidden">
            <span class="post-session-msg">✓ Session gespeichert</span>
            <div class="post-session-actions">
              <button id="btn-undo-session" class="btn-post-action btn-undo">Rückgängig</button>
              <button id="btn-repeat-session" class="btn-post-action btn-repeat">Wiederholen</button>
            </div>
          </div>
        </div>

        <div id="phase-transition" class="phase-transition hidden">
          <div id="phase-transition-content"></div>
          <button id="btn-advance-phase" class="btn-advance" disabled>Jetzt wechseln</button>
        </div>
      </section>

      <!-- Page: Rangliste -->
      <section id="page-leaderboard" class="page hidden">
        <div class="section">
          <div id="leaderboard" class="leaderboard">
            <p class="no-data-text">Lade...</p>
          </div>
        </div>
      </section>

      <!-- Page: Trainingsplan -->
      <section id="page-plan" class="page hidden">
        <div class="section">
          <div id="plan-reference"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- Scripts — order matters: supabase → data → db → auth → sync → app -->
  <script src="js/vendor/supabase.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
